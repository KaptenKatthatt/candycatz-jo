<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍭Candy Catz</title>

  <!-- FONT IMPORT FROM GOOGLE  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- ICON IMPORT FROM BOOTSTRAP  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.x.x/font/bootstrap-icons.css"
    media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.x.x/font/bootstrap-icons.css">
  </noscript>
</head>

<body>
  <header>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-grad bg-body-tertiary fixed-top">
    </nav>
  </header>
  <main class="container-fluid">

    <!-- Carousel -->
    <section class="carouselContainer">
    </section>
    <!--offCan slide out cart-->
    <div id="offCan"></div>

    <div class="container-fluid allCardsContainer mt-1 mb-3" id="topTreats">
      <div class="row mainBox text-center">
        <section>
          <h2 class="card-header">Top Treats</h2>
          <div class="row justify-content-end me-0">
          <div class="candyAmount col-auto position-fixed">🍬<span class="badge rounded-pill bg-secondary candyAmountRendered"></span></div>
          </div>
          <div class="topTreatsCardsContainer d-flex flex-wrap gap-3 mt-3 text-center justify-content-center mb-3">
          </div>
        </section>
        <section>
          <h2 class="card-header" id="sweetSavings">Sweet Savings</h2>
          <div class="sweetSavingsCardsContainer d-flex flex-wrap gap-3 mt-3 text-center justify-content-center mb-3">
          </div>
        </section>
        <section>
          <h2 class="card-header" id="moreToMunch">More to Munch</h2>
          <div class="moreToMunchCardsContainer d-flex flex-wrap gap-3 mt-3 text-center justify-content-center mb-3">
          </div>
          <div class="container-fluid moreToMunchBtn d-flex justify-content-center">
            <button type="button" class="btn btn-primary munchBtn">MER GOTT...</button>
          </div>
        </section>
      </div>


    </div>

    <!-- Modal placeholder -->
    <div class="modalContainer"></div>

    <!--CART CHECKOUT FORM in Accordion-->
    <section id="cartCheckoutContainer" class="card card-body mt-2 mb-5 d-none">
      <div id="cartView">
      </div>
      <div id="checkoutForm">
      </div>
      <div id="placedOrderView">
      </div>
    </section>
  </main>

  <!-- FOOTER SECTION  -->

  <footer id="footer"></footer>


  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
