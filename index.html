<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candy Catz</title>
  <meta name="description"
    content="Upptäck CandyCatz - din ultimata destination för läckra godisar och sötsaker. Pop and chew - all dreams come true!" />

  <link rel="preload" href="/img/sockerKick.webp" as="image" fetchpriority="high">
  <link rel="preload" href="/img/suris.webp" as="image">
  <link rel="preload" href="/img/godisdag.webp" as="image">

  <!-- Font preloads -->
  <link rel="preload" href="/src/assets/fonts/super_chiby/Super%20Chiby.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/src/assets/fonts/Figtree/Figtree-VariableFont_wght.ttf" as="font" type="font/ttf"
    crossorigin>
  <link rel="preload" href="/src/assets/fonts/Chicle/Chicle-Regular.ttf" as="font" type="font/ttf" crossorigin>

  <!-- ICON IMPORT FROM BOOTSTRAP  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.x.x/font/bootstrap-icons.css"
    media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.x.x/font/bootstrap-icons.css">
  </noscript>
  <!-- Trig.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/trig-js/src/trig-animations.min.css" media="print"
    onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/trig-js/src/trig-animations.min.css">
  </noscript>
</head>

<body>
  <header>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-gradient bg-body-tertiary fixed-top">
    </nav>
  </header>
  <main>

    <!-- Carousel -->
    <div class="carousel-container">
      <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="/img/sockerKick.webp" class="w-100" alt="Picture of yummy candy" fetchpriority="high"
              loading="eager" ${} />
          </div>
          <div class="carousel-item">
            <img src="/img/suris.webp" class="w-100" alt="Picture with sour sweet treats" loading="lazy" />
          </div>
          <div class="carousel-item">
            <img src="/img/godisdag.webp" class="w-100" alt="Picture of soft mashmallow" loading="lazy" />
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
          data-bs-slide="prev">
          <span aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
          data-bs-slide="next">
          <span aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>
    <div class="scroll-container">
      <div class="scroll-content">
        <span>⭐ CANDY CATZ ⭐ SÖTT 🍬 SALT 🧂 SURT 😗 GODIS 😻 YUM 🍭 SÖTT 💗 OMG </span>
        <span>⭐ CANDY CATZ ⭐ SÖTT 🍬 SALT 🧂 SURT 😗 GODIS 😻 YUM 🍭 SÖTT 💗 OMG </span>
        <span>⭐ CANDY CATZ ⭐ SÖTT 🍬 SALT 🧂 SURT 😗 GODIS 😻 YUM 🍭 SÖTT 💗 OMG </span>
        <span>⭐ CANDY CATZ ⭐ SÖTT 🍬 SALT 🧂 SURT 😗 GODIS 😻 YUM 🍭 SÖTT 💗 OMG </span>

      </div>
    </div>
    <!--offCan slide out cart-->
    <div id="offCan"></div>

    <div class="container-fluid all-cards-container mt-2 mb-3 pb-3 " id="topTreats">
      <div class="row text-center">
        <div class="wavebox  ">

          <section>
            <h2 class="card-header pt-5">Top Treats</h2>
            <div class="candyAmountRendered pt-0">
            </div>

            <div class="top-treats-side-scroller-container-outer pb-2">
              <div class="top-treats-side-scroller-container">
              </div>
              <div class="top-treats-side-scroller-wrapper">
                <span class="scroll-arrow scroll-arrow-left"><i class="bi bi-arrow-left-circle-fill"></i></span>
                <span class="scroll-arrow scroll-arrow-right"><i class="bi bi-arrow-right-circle-fill"></i></span>
              </div>
            </div>
          </section>
        </div>

        <section>
          <div class="scallopbox mt-5">
            <h2 class="card-header trig-pop" id="sweetSavings">Sweet Savings</h2>
            <div class="sweet-savings-cards-container gap-2 mt-2 text-center mb-3 trig-pop enable-trig ">
            </div>
          </div>
        </section>

        <div class="waveborder mt-2"></div>

        <section class="trig-grow enable-trig">
          <div class="wave-more-to-munch">
            <h2 class="card-header mt-2" id="moreToMunch">More to Munch</h2>
          </div>
          <div
            class="more-to-munch-cards-container d-flex flex-wrap gap-2 mt-4 text-center justify-content-center mb-3 trig-target">
          </div>
          <div class="container-fluid d-flex justify-content-center">
            <button type="button" class="munch-btn btn" aria-label="Visa mer godis">MER GOTT...</button>
          </div>
        </section>

      </div>
    </div>

    <!-- Modal placeholder -->
    <div class="modal-container"></div>

    <!--CART CHECKOUT FORM in Accordion-->
    <div id="cartCheckoutContainer" class="mt-2 mb-5 d-none">
      <div id="cartView">
      </div>
      <div id="checkoutForm">
      </div>
      <div id="placedOrderView">
      </div>
    </div>
  </main>

  <!-- FOOTER SECTION  -->
  <footer id="footer"></footer>
  <!-- Trig.js -->
  <script src="https://cdn.jsdelivr.net/npm/trig-js/src/trig.min.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
