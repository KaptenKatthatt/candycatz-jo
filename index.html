<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍭Candy Catz</title>

  <!-- FONT IMPORT FROM GOOGLE  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chicle&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" 
  rel="stylesheet">
  <!-- ICON IMPORT FROM BOOTSTRAP  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.x.x/font/bootstrap-icons.css"
    media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.x.x/font/bootstrap-icons.css">
  </noscript>
</head>

<body>
  <header>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-grad bg-body-tertiary fixed-top">
    </nav>
  </header>
  <main class="container-fluid">

    <!-- Carousel -->
    <section class="carouselContainer">
    </section>
    <div class="scroll-container">
      <h4><span>⭐ CANDY CATZ ⭐ SÖTT 🍬 SALT 🧂 SURT 😗 CANDY CATZ 😻 YUM 🍭 SÖTT 💗 OMG </span>
      <span>⭐ CANDY CATZ ⭐ SÖTT 🍬 SALT 🧂 SURT 😗 CANDY CATZ 😻 YUM 🍭 SÖTT 💗 OMG </span></h4>
    </div>
    <!--offCan slide out cart-->
    <div id="offCan"></div>

    <div class="container-fluid allCardsContainer mt-1 mb-3 pb-3" id="topTreats">
      <div class="row text-center">
        <div class="wavebox">        
          <section>
          <h2 class="card-header pt-4">Top Treats</h2> 
          <div class="candyAmount">🍬<span class="badge rounded-pill bg-secondary candyAmountRendered"></span>
          </div>
          <div class="topTreatsSideScrollerContainerOuter pb-2">
            <div class="topTreatsSideScrollerContainer">
            </div>
            <div class="topTreatsSideScrollerWrapper">
              <span class="scrollArrow scrollArrowLeft"><i class="bi bi-arrow-left-circle-fill"></i></span>
              <span class="scrollArrow scrollArrowRight"><i class="bi bi-arrow-right-circle-fill"></i></span>
            </div>
          </div>
      </section>
      </div>
      <div class="waveborder mt-1"></div>

      <section>
        <div class="scallopbox mt-5">
        <h2 class="card-header" id="sweetSavings">Sweet Savings</h2>
        <div class="sweetSavingsCardsContainer d-flex flex-wrap gap-3 mt-3 text-center justify-content-center mb-3">
        </div>
        </div>
      </section>

      <section>
        <div class="wavecard">
        <h2 class="card-header mt-5" id="moreToMunch">More to Munch</h2></div>
        <div class="moreToMunchCardsContainer d-flex flex-wrap gap-3 mt-3 text-center justify-content-center mb-3">
        </div>
        <div class="container-fluid moreToMunchBtn d-flex justify-content-center">
          <button type="button" class="btn btn-primary munchBtn">MER GOTT...</button>
        </div>
        </div>
      </section>
    </div>
    </div>

    <!-- Modal placeholder -->
    <div class="modalContainer"></div>

    <!--CART CHECKOUT FORM in Accordion-->
    <section id="cartCheckoutContainer" class="card card-body mt-2 mb-5 d-none">
      <div id="cartView">
      </div>
      <div id="checkoutForm">
      </div>
      <div id="placedOrderView">
      </div>
    </section>
  </main>

  <!-- FOOTER SECTION  -->
  <footer id="footer"></footer>

  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
